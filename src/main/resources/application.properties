spring.application.name=ecom-application

# DATASOURCE

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.username=sa
spring.datasource.password=

# H2 CLIENT

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA, SQL

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create
# nâo é apropriado para produção, cria as tabelas ao iniciar a aplicação e pode apagar as tabelas anteriores, recriando-as. Portanto, você pode perder os dados existentes.